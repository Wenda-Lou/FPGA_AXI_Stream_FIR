name: Web reference acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser-test dependencies
        run: python -m pip install --target build/web_test_deps -r web_tests/requirements.txt
      - name: Python, backend and reference-mode Selenium
        run: python scripts/run_web_tests.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-reference-acceptance
          if-no-files-found: warn
          path: |
            build/web_validation/reference-only/
            build/web_e2e/results.json
            build/web_e2e/*.png
            build/web_e2e/*.html
